services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: template_test
      POSTGRES_DB: template_api_test
      POSTGRES_PASSWORD: ${TEMPLATE_TEST_PASSWORD:?Use the PostgreSQL test runner}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 3s
      retries: 30
