app:
  name: !ENV ${APP_NAME:template-api-python}
  version: "0.1.0"
persistence:
  driver: !ENV ${PERSISTENCE_DRIVER:postgresql}
  postgres:
    host: !ENV ${POSTGRES_HOST:localhost}
    port: !ENV ${POSTGRES_PORT:5432}
    username: !ENV ${POSTGRES_USER:app}
    password: !ENV ${POSTGRES_PASSWORD:}
    database: !ENV ${POSTGRES_DB:app}
    ssl_mode: !ENV ${POSTGRES_SSL_MODE:disable}
    pool_mode: !ENV ${POSTGRES_POOL_MODE:queue}
    credentials_json: !ENV ${POSTGRES_CREDENTIALS_JSON:}
cors:
  allowed_origins: !ENV ${CORS_ALLOWED_ORIGINS:}
logging:
  level: !ENV ${LOG_LEVEL:INFO}
